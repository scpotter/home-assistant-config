- id: '1733956087755'
  alias: 'Pico Control: Studio'
  description: Control Nanoleaf Matter bulbs
  use_blueprint:
    path: stephack/core-pico.yaml
    input:
      auto_mode: queued
      pico_remote: 6fb679549e994ebe6a0faa5475a9095a
      top_on:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
          area_id: studio
      top_on_release: []
      bottom_off:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          area_id: studio
      up_raise:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: 5
        target:
          area_id: studio
      down_lower:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: -5
        target:
          area_id: studio
      mode_max: 3
      middle_stop:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          area_id: studio
