    entity_id:
    - binary_sensor.outside_bright
    - binary_sensor.outside_dark
    - binary_sensor.outside_dim
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.outside_dark
