- id: '1789577474223'
  alias: Github config push
  description: On any /config change, push both home-assistant-config and esphome-config to GitHub
  triggers:
  - trigger: event
    event_type: folder_watcher
    event_data:
      event_type: created
  - trigger: event
    event_type: folder_watcher
    event_data:
      event_type: modified
  - trigger: event
    event_type: folder_watcher
    event_data:
      event_type: deleted
  - trigger: event
    event_type: folder_watcher
    event_data:
      event_type: moved
  conditions: []
  actions:
  - delay: 00:00:05
  - action: shell_command.push_home_assistant_config
  - action: shell_command.push_esphome_config
  mode: restart
- id: '1789811525000'
  alias: Github config pull
  description: Every 5 minutes, fast-forward pull main into /config and /config/esphome
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - action: shell_command.pull_home_assistant_config
  - action: shell_command.pull_esphome_config
  mode: single
