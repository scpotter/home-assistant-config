homeassistant:
  customize: !include customize.yaml
  allowlist_external_dirs:
    - /config
  packages:
### APC PDU7920 Virtual Device ###############################################
    pdu: !include conf-PDU.yaml # Important: Host needs SNMP
default_config:

automation: !include automations.yaml
group: !include groups.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

### PIONEER AVR SC-71 ##########################################################
media_player: !include conf-pioneer_avr.yaml
#
### Envisalink Duo ##########################################################
envisalink: !include conf-envisalink.yaml
#
### Config sync (git pull/push automation)
shell_command:
  pull_home_assistant_config: "cd /config && { date; git fetch origin && git merge --ff-only origin/main; } >> /config/.pull_home_assistant_config.log 2>&1"
  pull_esphome_config: "cd /config/esphome && { date; git fetch origin && git merge --ff-only origin/main; } >> /config/.pull_esphome_config.log 2>&1"
  push_home_assistant_config: "cd /config && { date; git add -A && (git diff --cached --quiet && echo 'No changes to push.' || (git commit -m 'HAOS config sync' && git fetch origin && git merge --ff-only origin/main && git push origin main)); } >> /config/.push_home_assistant_config.log 2>&1"
  push_esphome_config: "cd /config/esphome && { date; git add -A && (git diff --cached --quiet && echo 'No changes to push.' || (git commit -m 'HAOS config sync' && git fetch origin && git merge --ff-only origin/main && git push origin main)); } >> /config/.push_esphome_config.log 2>&1"