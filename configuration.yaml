homeassistant:
  customize: !include customize.yaml
  allowlist_external_dirs:
    - /config
  packages:
### APC PDU7920 Virtual Device ###############################################
    pdu: !include conf-PDU.yaml # Important: Host needs SNMP
default_config:

automation: !include automations.yaml
group: !include groups.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

### PIONEER AVR SC-71 ##########################################################
media_player: !include conf-pioneer_avr.yaml
#
### Envisalink Duo ##########################################################
envisalink: !include conf-envisalink.yaml
#
### Quick Test
### Slice 7a Plan C — config sync (pull leg, Stage 1)
shell_command:
  plan_b_stub_trigger: "date >> /config/.plan_b_stub_trigger.log"
  pull_home_assistant_config: "cd /config && git fetch origin && git merge --ff-only origin/main"
  pull_esphome_config: "cd /config/esphome && git fetch origin && git merge --ff-only origin/main"
  push_home_assistant_config: "cd /config && git add -A && git diff --cached --quiet || (git commit -m 'HAOS config sync' && git fetch origin && git merge --ff-only origin/main && git push origin main)"
  push_esphome_config: "cd /config/esphome && git add -A && git diff --cached --quiet || (git commit -m 'HAOS config sync' && git fetch origin && git merge --ff-only origin/main && git push origin main)"
